# The whole backend: six services behind the Kong gateway.
#
#   npm run dev            (from the repo root)
#   docker compose -f infrastructure/docker-compose.yml up --build
#
# Paths below are relative to this file, so `..` is the repo root — that is the
# build context, since the image installs the npm workspace from the root.
#
# Only Kong is published to the host (port 8000). The services talk to each
# other, and Kong talks to them, over the internal `backend` network using the
# container name as hostname — so nothing but the gateway is reachable from
# outside. To debug one service directly, add a `ports:` entry to it.
#
# ../services is bind-mounted into every container so edits on the host reload
# the running service (see the Dockerfile CMD for why that needs polling).

# Without this the project would be named after this file's folder
# ("infrastructure"), which says nothing about what is running.
name: backend-repo

x-service: &service
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  image: backend-repo-service
  restart: unless-stopped
  volumes:
    - ../services:/app/services
  networks:
    - backend
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  event:
    <<: *service
    container_name: event-service
    environment:
      SERVICE: event
      PORT: 3001
      # The event service owns the event_inventory schema.
      DB_HOST: ${DB_HOST:?DB_HOST not set in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME_EVENT_INVENTORY:-event_inventory}
      DB_USER: ${DB_USER:-onestage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      SCANNER_SESSION_TTL_MIN: ${SCANNER_SESSION_TTL_MIN:-480}
      TICKET_INTERNAL_SHARED_SECRET: ${TICKET_INTERNAL_SHARED_SECRET:?TICKET_INTERNAL_SHARED_SECRET not set in variables.env}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

  inventory:
    <<: *service
    container_name: inventory-service
    environment:
      SERVICE: inventory
      PORT: 3002
      DB_HOST: ${DB_HOST:?DB_HOST not set in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME_EVENT_INVENTORY:-event_inventory}
      DB_USER: ${DB_USER:-onestage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}

  queue:
    <<: *service
    container_name: queue-service
    volumes:
      - ../services:/app/services
      - "${AWS_SHARED_CONFIG_DIR:-${USERPROFILE:-${HOME}}/.aws}:/root/.aws:ro"
    environment:
      SERVICE: queue
      PORT: 3003
      DB_HOST: ${DB_HOST:?DB_HOST not set in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME_QUEUE:-queue}
      DB_USER: ${DB_USER:-onestage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      ADMISSION_TOKEN_TTL_SEC: ${ADMISSION_TOKEN_TTL_SEC:-600}
      AUTO_ADMISSION_ENABLED: ${AUTO_ADMISSION_ENABLED:-true}
      ADMISSION_SCHEDULER_POLL_MS: ${ADMISSION_SCHEDULER_POLL_MS:-1000}
      CUSTOMER_ADMITTED_QUEUE_URL: ${CUSTOMER_ADMITTED_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SDK_LOAD_CONFIG: "1"

  order:
    <<: *service
    container_name: order-service
    volumes:
      - ../services:/app/services
      - "${AWS_SHARED_CONFIG_DIR:-${USERPROFILE:-${HOME}}/.aws}:/root/.aws:ro"
    environment:
      SERVICE: order
      PORT: 3004
      DB_HOST: ${DB_HOST:?DB_HOST not set in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME_CHECKOUT:-checkout}
      DB_USER: ${DB_USER:-onestage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      ORDER_EVENTS_QUEUE_URL: ${ORDER_EVENTS_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SDK_LOAD_CONFIG: "1"

  ticket:
    <<: *service
    container_name: ticket-service
    volumes:
      - ../services:/app/services
      - "${AWS_SHARED_CONFIG_DIR:-${USERPROFILE:-${HOME}}/.aws}:/root/.aws:ro"
    environment:
      SERVICE: ticket
      PORT: 3005
      DB_HOST: ${DB_HOST:?DB_HOST not set in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME_TICKETING:-ticketing}
      DB_USER: ${DB_USER:-onestage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}
      SCANNER_SESSION_SECRET: ${SCANNER_SESSION_SECRET:?SCANNER_SESSION_SECRET not set in variables.env}
      TICKET_INTERNAL_SHARED_SECRET: ${TICKET_INTERNAL_SHARED_SECRET:?TICKET_INTERNAL_SHARED_SECRET not set in variables.env}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      ORDER_EVENTS_QUEUE_URL: ${ORDER_EVENTS_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SDK_LOAD_CONFIG: "1"

  notification:
    <<: *service
    container_name: notification-service
    environment:
      SERVICE: notification
      PORT: 3006
      # The notification service owns the notification schema.
      DB_HOST: ${DB_HOST:?DB_HOST not set in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME_NOTIFICATION:-notification}
      DB_USER: ${DB_USER:-onestage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}
      # Gmail SMTP sender for booking confirmation emails.
      SMTP_USER: ${SMTP_USER:-onestagecontacts@gmail.com}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:?SMTP_APP_PASSWORD not set in .env}

  auth:
    <<: *service
    container_name: auth-service
    environment:
      SERVICE: auth
      PORT: 3007
      # Which pool to verify tokens against. Not secrets.
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Credentials for the admin call that grants group membership. In AWS
      # these come from the ECS task role and none of these are set.
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

  kong:
    image: kong:3.9
    container_name: kong-gateway
    restart: unless-stopped
    depends_on:
      event: { condition: service_healthy }
      inventory: { condition: service_healthy }
      queue: { condition: service_healthy }
      order: { condition: service_healthy }
      ticket: { condition: service_healthy }
      notification: { condition: service_healthy }
      auth: { condition: service_healthy }
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000" # proxy — the only way in, and what the frontend talks to
      - "127.0.0.1:8001:8001" # admin API, loopback only
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge
