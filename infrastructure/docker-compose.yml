# The whole backend: six services behind the Kong gateway.
#
#   npm run dev            (from the repo root)
#   docker compose -f infrastructure/docker-compose.yml up --build
#
# Paths below are relative to this file, so `..` is the repo root — that is the
# build context, since the image installs the npm workspace from the root.
#
# Only Kong is published to the host (port 8000). The services talk to each
# other, and Kong talks to them, over the internal `backend` network using the
# container name as hostname — so nothing but the gateway is reachable from
# outside. To debug one service directly, add a `ports:` entry to it.
#
# ../services is bind-mounted into every container so edits on the host reload
# the running service (see the Dockerfile CMD for why that needs polling).

# Without this the project would be named after this file's folder
# ("infrastructure"), which says nothing about what is running.
name: backend-repo

x-service: &service
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  image: backend-repo-service
  restart: unless-stopped
  volumes:
    - ../services:/app/services
  networks:
    - backend
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  event:
    <<: *service
    container_name: event-service
    environment:
      SERVICE: event
      PORT: 3001
      # Same local-dev DB wiring as auth (see its block below for the full
      # explanation) — needed now that /events and /helper/shifts read from MySQL.
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-onestage}
      DB_USER: ${DB_USER:-onestage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}

  inventory:
    <<: *service
    container_name: inventory-service
    environment:
      SERVICE: inventory
      PORT: 3002

  queue:
    <<: *service
    container_name: queue-service
    environment:
      SERVICE: queue
      PORT: 3003

  order:
    <<: *service
    container_name: order-service
    environment:
      SERVICE: order
      PORT: 3004

  ticket:
    <<: *service
    container_name: ticket-service
    environment:
      SERVICE: ticket
      PORT: 3005

  notification:
    <<: *service
    container_name: notification-service
    environment:
      SERVICE: notification
      PORT: 3006

  auth:
    <<: *service
    container_name: auth-service
    environment:
      SERVICE: auth
      PORT: 3007
      # Which pool to verify tokens against. Not secrets.
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      # Local-only: read from the repo-root .env (docker compose's default env
      # file, since local_start.bat runs `docker compose` from the repo root).
      # Production never reads this file — ECS sets these directly from
      # Terraform (locals.tf) and Secrets Manager, pointing at the in-cluster
      # "mysql" service instead of this dynamic-IP DB.
      DB_HOST: ${DB_HOST:-54.255.133.80}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-onestage}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
      DB_SSL: ${DB_SSL:-false}
      # Credentials for the admin call that grants group membership. In AWS
      # these come from the ECS task role and none of these are set.
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      # Sourced from .env, same as the auth service's DB_* vars below, so both
      # sides of the connection always agree — no credentials hardcoded here.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD not set in .env}
      MYSQL_DATABASE: ${DB_NAME:-onestage}
      MYSQL_USER: ${DB_USER:-onestage}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set in .env}
    ports:
      # Host 3307 because a locally installed MySQL usually owns 3306 and the
      # bind would fail. Loopback-only: no reason for this to be reachable
      # from the LAN. Inside the compose network the port is still 3306, so
      # only host tools (Workbench, migrate-database.ps1) use 3307.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Named 00- so it runs before ./sql's 01-init-admin-user.sql, which
      # inserts into tables this script creates.
      - ../database/02-init-create-tables-index.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kong:
    image: kong:3.9
    container_name: kong-gateway
    restart: unless-stopped
    depends_on:
      event: { condition: service_healthy }
      inventory: { condition: service_healthy }
      queue: { condition: service_healthy }
      order: { condition: service_healthy }
      ticket: { condition: service_healthy }
      notification: { condition: service_healthy }
      auth: { condition: service_healthy }
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000" # proxy — the only way in, and what the frontend talks to
      - "127.0.0.1:8001:8001" # admin API, loopback only
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
    driver: local
