name: Terraform CI

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"

permissions:
  contents: read

# Review-only: fmt/validate/lint/security-scan a proposed infra change.
# Never applies — every terraform apply/destroy stays manual and local,
# reviewed by a human before running, per this repo's aws-terraform-change
# governance skill.
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
