name: k6 academic concurrency evidence

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/k6-academic-evidence.yml'
      - 'k6/disposable-concurrency.js'
      - 'k6/fixtures/inventory-schema.sql'
      - 'scripts/init-k6-database.mjs'
      - 'scripts/start-k6-inventory-fixture.mjs'
      - 'scripts/verify-k6-inventory.mjs'
      - 'services/inventory/**'

permissions:
  contents: read

jobs:
  no-oversell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: k6-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: k6-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_SSL: 'false'
      K6_FIXTURE_ENV_FILE: /tmp/onestage-k6-fixture.env
      K6_FIXTURE_PID_FILE: /tmp/onestage-k6-fixture.pid

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Initialize disposable database
        run: node scripts/init-k6-database.mjs

      - name: Start real inventory API with disposable fixture
        run: |
          node --import tsx scripts/start-k6-inventory-fixture.mjs &
          echo "$!" > "$K6_FIXTURE_PID_FILE"
          for attempt in {1..30}; do
            if [ -s "$K6_FIXTURE_ENV_FILE" ]; then
              cat "$K6_FIXTURE_ENV_FILE" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Inventory fixture did not become ready"
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0

      - name: Race 50 customers for 10 tickets
        run: |
          mkdir -p k6-results
          k6 run --summary-export k6-results/disposable-concurrency.json k6/disposable-concurrency.js

      - name: Verify database invariant
        run: node scripts/verify-k6-inventory.mjs

      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-disposable-concurrency-${{ github.run_id }}
          path: k6-results/disposable-concurrency.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up fixture
        if: always()
        run: |
          if [ -s "$K6_FIXTURE_PID_FILE" ]; then
            fixture_pid="$(cat "$K6_FIXTURE_PID_FILE")"
            kill "$fixture_pid" || true
            for attempt in {1..10}; do
              if ! kill -0 "$fixture_pid" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            echo "::warning::Fixture process did not finish cleanup within 10 seconds"
          fi
