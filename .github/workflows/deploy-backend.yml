name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "infrastructure/Dockerfile.prod"
      - "infrastructure/kong/**"
  workflow_dispatch:
    inputs:
      run_load_test:
        description: "Run the read-only Grafana Cloud k6 gate after deployment"
        type: boolean
        default: false
      force_deploy:
        description: "Emergency only: deploy even if lint, build or unit tests fail (they still run)"
        type: boolean
        default: false
      force_reason:
        description: "Why the deploy must go out despite failing checks (required with force_deploy)"
        type: string
        default: ""

# id-token: write is granted per job below, so the test job never gets AWS
# credentials.
permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECS_CLUSTER: onestage-cluster

jobs:
  # Lint, build and unit tests on the commit being deployed. They always run,
  # forced deploy or not, so a forced deploy still records what failed.
  quality:
    uses: ./.github/workflows/backend-quality.yml

  build-and-push:
    needs: quality
    # A failed quality run blocks the deploy unless someone forces it by hand
    # (workflow_dispatch with force_deploy). A push to main can never force.
    # !cancelled() lets this job run after a failed `quality` at all, which
    # GitHub would otherwise skip outright.
    if: >-
      ${{ !cancelled() && (
        needs.quality.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
      ) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha: ${{ github.sha }}
    steps:
      - name: Record forced deploy
        if: github.event_name == 'workflow_dispatch' && inputs.force_deploy
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          FORCE_REASON: ${{ inputs.force_reason }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${FORCE_REASON// /}" ]; then
            echo "::error::force_deploy needs a force_reason"
            exit 1
          fi
          echo "::warning::Forced deploy by $ACTOR (quality: $QUALITY_RESULT): $FORCE_REASON"
          {
            echo "## Forced deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Triggered by | $ACTOR |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Quality result | $QUALITY_RESULT |"
            echo "| Reason | $FORCE_REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Task definitions reference the `:latest` tag directly (see
      # infrastructure/terraform/locals.tf) — pushing a fresh `:latest` plus
      # a `force-new-deployment` in the deploy job below is enough to roll
      # it out. Also tag with the commit SHA for traceability in ECR.
      - name: Build and push backend image
        env:
          REPO: ${{ steps.ecr-login.outputs.registry }}/onestage-backend
        run: |
          docker build -f infrastructure/Dockerfile.prod -t "$REPO:latest" -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:latest"
          docker push "$REPO:${{ github.sha }}"

      - name: Build and push kong image
        env:
          REPO: ${{ steps.ecr-login.outputs.registry }}/onestage-kong
        run: |
          docker build -t "$REPO:latest" -t "$REPO:${{ github.sha }}" infrastructure/kong
          docker push "$REPO:latest"
          docker push "$REPO:${{ github.sha }}"

  deploy:
    needs: build-and-push
    # Without this, GitHub skips the job whenever `quality` failed, even when
    # build-and-push ran because the deploy was forced.
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # No `environment: production` — that key changes the OIDC subject
    # claim from the ref-based form to "repo:org/repo:environment:<name>",
    # which the trust policy doesn't grant (and this repo has no actual
    # environment protection rules configured anyway). Re-add both — this
    # key and a matching StringLike value in
    # infrastructure/terraform/iam_oidc.tf — together if a real reviewer
    # gate is ever set up.
    strategy:
      matrix:
        service: [kong, event, inventory, queue, order, ticket, notification, auth]
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment for onestage-${{ matrix.service }}
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "onestage-${{ matrix.service }}" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for onestage-${{ matrix.service }} to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "onestage-${{ matrix.service }}"

  k6-read-only:
    needs: deploy
    if: >-
      ${{ !cancelled() &&
        needs.deploy.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.run_load_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Grafana Cloud k6 configuration
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_BASE_URL: ${{ vars.K6_BASE_URL }}
          K6_CLOUD_PROJECT_ID: ${{ vars.K6_CLOUD_PROJECT_ID }}
          K6_CLOUD_STACK_ID: ${{ vars.K6_CLOUD_STACK_ID }}
          K6_LOAD_ZONE: ${{ vars.K6_LOAD_ZONE }}
        run: |
          missing=0
          for name in K6_CLOUD_TOKEN K6_BASE_URL K6_CLOUD_PROJECT_ID K6_CLOUD_STACK_ID K6_LOAD_ZONE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0

      # The load runs only after every ECS service has stabilized. A failed
      # threshold is reported but does not fail or roll back the deployment.
      - name: Run read-only deployment gate
        id: k6
        continue-on-error: true
        uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_BASE_URL: ${{ vars.K6_BASE_URL }}
          K6_CLOUD_PROJECT_ID: ${{ vars.K6_CLOUD_PROJECT_ID }}
          K6_CLOUD_STACK_ID: ${{ vars.K6_CLOUD_STACK_ID }}
          K6_LOAD_ZONE: ${{ vars.K6_LOAD_ZONE }}
        with:
          path: k6/deployment-gate.js
          cloud-run-locally: false
          cloud-comment-on-pr: false
          fail-fast: true
          flags: >-
            --env K6_BASE_URL=${{ vars.K6_BASE_URL }}
            --env K6_CLOUD_PROJECT_ID=${{ vars.K6_CLOUD_PROJECT_ID }}
            --env K6_CLOUD_STACK_ID=${{ vars.K6_CLOUD_STACK_ID }}
            --env K6_LOAD_ZONE=${{ vars.K6_LOAD_ZONE }}

      - name: Record k6 result
        if: always()
        env:
          OUTCOME: ${{ steps.k6.outcome }}
          TEST_RUN_IDS: ${{ steps.k6.outputs.testRunIds }}
        run: |
          {
            echo "## Grafana Cloud k6 deployment gate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Outcome | $OUTCOME |"
            echo "| Test run IDs | ${TEST_RUN_IDS:-unavailable} |"
            echo "| Deployment | retained; no automatic rollback |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report k6 warning
        if: steps.k6.outcome == 'failure'
        run: |
          echo "::warning::Grafana Cloud k6 deployment gate failed; deployment was retained"
